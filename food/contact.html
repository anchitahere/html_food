<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact FC</title>
</head>
<body>
    <header>
        <h1> Contact Us </h1>
    </header>
    <hr>
    <main>
    <section>
        <h2>Our Contact Form</h2>
        <form action="https://info.org/get" method="get">
            <fieldset>
                <legend>Send Us A Message</legend>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name" placeholder="your name" required><br><br>
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="your email" required><br><br>
                    <label for="message">Your Message:</label><br>
                    <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here" ></textarea><br>
                </p>
            </fieldset>
            <button type="submit">Send</button>
            <button type="reset">Reset</button>

        </form>
    </section>
    <section>
        <h2>Our Location</h2>
        <address>
            555 Fry Temptation Lane,Suite T<br>
            Kolkata, M0 55555-5555
            <br><br>
            phone:<a href="tel:+5555555555">555-555-5555</a>
        </address>
    </section>
    <p>
        <a href="index.html">Go To Home</a>
    </p>
    </main>
    <hr>
    <footer>
        <p>Copyright &copy; Fry Carts</p>
    </footer>
</body>
</html>
